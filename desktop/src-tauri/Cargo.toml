[package]
name = "medcontrol"
version = "0.4.0"
description = "MedControl desktop app"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[lib]
name = "medcontrol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde_json = "1"
rfd = "0.15"
open = "5"
sys-locale = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
