Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 20
LogLevel Warning
DisableViaHeader Yes
# Only this stack's compose network (pinned in docker-compose.yml) may use the proxy; other containers and the LAN are denied.
Allow __STACK_SUBNET__
ConnectPort 443
ConnectPort 80
# Only hosts listed in the filter pass, for plain HTTP and for HTTPS (CONNECT) alike: add every new outbound service there.
Filter "/etc/tinyproxy/filter"
# extended regular expressions: every line of the filter is anchored as (^|\.)host$
FilterType ere
FilterDefaultDeny Yes
FilterURLs No
