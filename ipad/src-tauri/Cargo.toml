[package]
name = "medcontrol-ipad"
version = "0.0.1"
description = "MedControl for iPad (spike)"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "medcontrol_ipad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
block2 = { version = "0.6.2", default-features = false, features = ["alloc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }
