name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repository: the token they get can do nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: gateway (unit + integration on Postgres and PGlite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dtc
          POSTGRES_PASSWORD: dtc
          POSTGRES_DB: dtc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dtc -d dtc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://dtc:dtc@localhost:5432/dtc
      - name: npm run test:integration (PGlite)
        run: npm run test:integration
        env:
          TEST_DB: pglite

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  ingestion:
    name: ingestion (import check + parser tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ingestion/requirements.txt
            ingestion/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -c "import app.main"
      - run: python -m pytest -q
